<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <title>{% block title %} Recipe Book {% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


</head>
<body>
    <nav class = "navbar navbar-expand-lg navbar-light bg-warning mb-4">
        <div class = "container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fa-solid fa-utensils"></i> Recipe Book
            </a>
            <div class="d-flex">
                {% if session.get("user_id") %}
                    <a class="btn btn-outline-dark me-2" href="/favorites"> Favorites</a>
                    <a class="btn btn-outline-dark me-2" href="/add"> Add Recipe</a>
                    <a class="btn btn-outline-dark" href="/logout"> Logout</a>
                {% else %}
                    <a class="btn btn-outline-dark me-2" href="/login"> Login</a>
                    <a class="btn btn-outline-dark" href="/register"> Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center mt-4 mb-3 text-muted">
        <small>Stressed spelled backwards is desserts.🍰<a href="/"> Home</a>
</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


</body>












</html>
