{% extends "layout.html" %}
{% block title %}Register{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4 text-center">Create an Account</h2>

    <form action="/register" method="post">

      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input autocomplete="off" autofocus class="form-control" id="username" name="username" type="text" required>
      </div>


      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input class="form-control" id="password" name="password" type="password" required>
      </div>


      <div class="mb-3">
        <label for="confirmation" class="form-label">Confirm Password</label>
        <input class="form-control" id="confirmation" name="confirmation" type="password" required>
      </div>


      <button class="btn btn-success w-100" type="submit">Register</button>
    </form>

    <p class="text-center mt-3">
      Already have an account? <a href="/login">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
